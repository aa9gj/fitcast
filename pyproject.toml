[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcast"
version = "0.1.0"
description = "Forecast your fit for jobs from public job boards."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Arby Abood" }
]
dependencies = [
  "anthropic>=0.92.0",
  "pydantic>=2.0",
  "requests>=2.28",
  "pyyaml>=6.0",
  "PyPDF2>=3.0",
  "python-docx>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
embeddings = [
  "sentence-transformers>=2.2.0",
]
full = [
  "pytest>=8.0",
  "sentence-transformers>=2.2.0",
]

[tool.setuptools]
py-modules = [
  "audit",
  "bootstrap_companies",
  "bootstrap_ontologies",
  "check_resume_format",
  "compare_resumes",
  "extract_keywords",
  "pipeline",
  "skill_extractor",
  "tailor",
  "track",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
