# Sources to scrape from. Enable any combination; results are merged and
# deduplicated by URL.

# ─── Greenhouse: hand-picked company boards ───────────────────────────────
# Highest-quality data — verbatim full job descriptions straight from each
# company's ATS. Find slugs at boards.greenhouse.io/<slug>. The script
# silently skips any slug that 404s, so feel free to over-include.
# Comment this whole block out to disable Greenhouse.
greenhouse:
  companies:
    - recursionpharmaceuticals  # AI drug discovery
    - ginkgobioworks            # synthetic biology / biotech platform
    - absci                     # AI drug discovery
    - flatironhealth            # oncology clinical / regulatory data
    - freenome                  # cancer diagnostics (multi-omics)
    - natera                    # genetic testing
    - komodohealth              # healthcare data analytics
    - doximity                  # medical professional network

# ─── Lever: public job board API ─────────────────────────────────────────
# Same shape as Greenhouse — slugs found at jobs.lever.co/<slug>.
# Many AI/ML companies use Lever (Anthropic, Cohere, Mistral, etc.).
# Comment out to disable.
lever:
  companies:
    - mistral             # AI / LLM
    - benchling01         # life sciences platform (alt slug)

# ─── Ashby: public job board API ─────────────────────────────────────────
# Same shape — slugs found at jobs.ashbyhq.com/<slug>.
# Many newer YC-era startups (Linear, Ramp, Notion, etc.).
# Comment out to disable.
ashby:
  companies:
    - linear              # planning tool (sample — replace with biotech-AI as you find them)

# ─── The Muse: public aggregator API (no auth, no slug list) ─────────────
# The Muse handles company discovery for you — broader coverage with zero
# list maintenance. Filter by category, level, and location instead.
# Comment this whole block out to disable The Muse.
muse:
  # Categories must match The Muse's exact taxonomy. Common ones with good
  # coverage: "Data and Analytics", "Healthcare", "Project Management",
  # "Science and Engineering", "Software Engineering", "Business Operations",
  # "Accounting and Finance", "Account Management", "Marketing".
  # See https://www.themuse.com/developers/api/v2 for the full list.
  categories:
    - Data and Analytics
    - Healthcare
    - Project Management
    - Science and Engineering
  # Levels: "Internship", "Entry Level", "Mid Level", "Senior Level",
  # "Management", "Senior Management".
  levels:
    - Senior Level
    - Mid Level
  # Locations: city names like "New York, NY" or "Flexible / Remote".
  locations:
    - Flexible / Remote
  max_pages: 2  # 20 results per page

# ─── Filtering & cost control ────────────────────────────────────────────
# Optional case-insensitive substring filter applied to title + body of every
# scraped job, regardless of source. Empty list = no filter.
keywords:
  - data
  - AI
  - digital
  - bioinform
  - computational
  - regulatory
  - product manager
  - business analyst
  - solutions

# How many jobs to deep-analyze per run with the main model. Cost lever.
max_jobs: 10

# Optional: only include jobs posted/updated within the given time window.
# Accepts an integer (hours) or a shorthand string: "24h", "1d", "7d", "2w",
# "1d12h", etc. Comment out (or remove) to disable.
# posted_within_hours: 7d
# posted_within_hours: "24h"
# posted_within_hours: 168

# ─── Location filter (optional) ──────────────────────────────────────────
# Substring matching on the job's location field (case-insensitive).
# Rules:
#   - `exclude` wins: any match drops the job
#   - `include` (if set): at least one match required
#   - both empty / block commented out = no location filtering
# location_filter:
#   # Specific cities — uses WORD-BOUNDARY matching to avoid false positives
#   # ("MA" wouldn't match inside "Manila"; "SF" wouldn't match "Salford").
#   cities:
#     - Boston
#     - New York
#     - San Francisco
#     - Seattle
#   # General terms — uses substring matching. Good for remote / countries.
#   include:
#     - remote
#     - hybrid
#     - united states
#     - usa
#   # Drops the job if any term matches the location. Wins over cities/include.
#   exclude:
#     - india
#     - philippines

# ─── Salary filter (optional) ────────────────────────────────────────────
# Filter by salary RANGE. Both bounds optional — set either or both.
# Semantics: drop only if the posting's range is ENTIRELY outside yours.
# A posting that overlaps your range passes (it might still hit your number).
# Postings with no salary mentioned PASS THROUGH — we don't penalize
# non-disclosing companies (most boards don't publish salary).
# salary_filter:
#   min: 100000   # USD per year (drop if posting's max stated salary < this)
#   max: 250000   # USD per year (drop if posting's min stated salary > this)

# Optional cheap pre-rank pass with Haiku 4.5 (~$0.0007 per candidate).
# When enabled, every candidate gets a quick relevance score and only the
# top max_jobs are deep-analyzed. Lets you scan a much larger pool for a
# few cents while keeping deep-analysis costs flat.
prerank:
  enabled: true
  threshold: 5         # 0-10 scale; jobs below this are dropped
  max_candidates: 100  # cap pre-rank pool size to bound cost

# ─── Notifications (optional) ─────────────────────────────────────────────
# POST a small JSON summary at end-of-run when new top-scoring jobs appear.
# Designed for cron schedules — saves you from opening results.csv every time.
# Works with Slack/Discord incoming webhooks and any generic JSON endpoint.
# CLI override: `python pipeline.py --notify-webhook https://...`
# notify:
#   webhook_url: "https://hooks.slack.com/services/..."
#   min_score: 75      # only notify when at least one new result hits this score
#   max_jobs: 5        # cap items in the message body
